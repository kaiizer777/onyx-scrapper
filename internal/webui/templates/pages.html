{{define "content"}}
<h2>Scraped Pages</h2>

<article>
    <form action="/ui/pages" method="GET" class="inline-form" style="margin-bottom: 0;">
        <div style="flex: 1;">
            <input type="search" name="q" placeholder="Search pages (FTS5)..." value="{{.Query}}" style="margin-bottom: 0;">
        </div>
        <button type="submit" style="margin-bottom: 0;">Search</button>
    </form>
</article>

<figure>
    <table role="grid">
        <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">URL</th>
                <th scope="col">Fetched At</th>
                {{if .IsSearch}}
                <th scope="col">Snippet</th>
                {{end}}
                <th scope="col">Action</th>
            </tr>
        </thead>
        <tbody>
            {{range .Pages}}
            <tr>
                <td>{{.ID}}</td>
                <td style="max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="{{.URL}}">{{.URL}}</td>
                <td>{{.FetchedAt.Format "2006-01-02 15:04:05"}}</td>
                {{if $.IsSearch}}
                <td><small>{{.Snippet}}</small></td>
                {{end}}
                <td><a href="/ui/page/{{.ID}}" role="button" class="outline">View</a></td>
            </tr>
            {{end}}
            {{if not .Pages}}
            <tr>
                <td colspan="5">No pages found.</td>
            </tr>
            {{end}}
        </tbody>
    </table>
</figure>
{{end}}
