{{define "content"}}
<h2>Dashboard</h2>

<div class="stats-grid">
    <div class="stat-card">
        <div class="stat-value">{{.Stats.PagesScraped}}</div>
        <div class="stat-label">Pages Scraped</div>
    </div>
    <div class="stat-card">
        <div class="stat-value">{{.Stats.ExtractionsDone}}</div>
        <div class="stat-label">Extractions</div>
    </div>
    <div class="stat-card">
        <div class="stat-value">{{.Stats.AgentRuns}}</div>
        <div class="stat-label">Agent Runs</div>
    </div>
    <div class="stat-card">
        <div class="stat-value">{{.Stats.DeepResearchRuns}}</div>
        <div class="stat-label">Research Runs</div>
    </div>
</div>

<div class="action-grid">
    <article>
        <header>Run Agent</header>
        <form action="/ui/agent" method="POST" class="inline-form">
            <div>
                <input type="text" id="goal" name="goal" placeholder="Goal e.g. Find the pricing of product X" required>
            </div>
            <button type="submit">Launch</button>
        </form>
    </article>
    
    <article>
        <header>Deep Research</header>
        <form action="/ui/research" method="POST" class="inline-form">
            <div>
                <input type="text" id="query" name="query" placeholder="Query e.g. Compare Top 3 Go scraping libraries" required>
            </div>
            <button type="submit">Start</button>
        </form>
    </article>
</div>
{{end}}
