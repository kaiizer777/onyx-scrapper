{{define "content"}}
<h2>Agent Runs</h2>

<article>
    <header>Launch New Agent Run</header>
    <form action="/ui/agent" method="POST" class="inline-form">
        <div style="flex: 2;">
            <input type="text" name="goal" placeholder="Goal (e.g. Find the top 3 Python web scrapers)" required>
        </div>
        <div>
            <input type="number" name="max_steps" placeholder="Max Steps (default 15)">
        </div>
        <button type="submit">Launch</button>
    </form>
</article>

{{if .RunDetail}}
    <h3>Run #{{.RunDetail.Run.ID}}</h3>
    <article>
        <header>
            <strong>Goal:</strong> {{.RunDetail.Run.Goal}}
            <span class="status-pill status-{{.RunDetail.Run.Status}}">{{.RunDetail.Run.Status}}</span>
        </header>
        
        <div id="live-status" 
             hx-get="/ui/agent/{{.RunDetail.Run.ID}}/status" 
             hx-trigger="every 1s" 
             hx-swap="innerHTML">
            <!-- HTMX will inject _run_status.html here -->
            <p aria-busy="true">Loading status...</p>
        </div>
        
    </article>
{{else}}
    <figure>
        <table role="grid">
            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Goal</th>
                    <th scope="col">Status</th>
                    <th scope="col">Created</th>
                    <th scope="col">Action</th>
                </tr>
            </thead>
            <tbody>
                {{range .Runs}}
                <tr>
                    <td>{{.ID}}</td>
                    <td>{{.Goal}}</td>
                    <td><span class="status-pill status-{{.Status}}">{{.Status}}</span></td>
                    <td>{{.CreatedAt.Format "2006-01-02 15:04:05"}}</td>
                    <td><a href="/ui/agent/{{.ID}}" role="button" class="outline">View</a></td>
                </tr>
                {{end}}
                {{if not .Runs}}
                <tr>
                    <td colspan="5">No agent runs found.</td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </figure>
{{end}}
{{end}}
